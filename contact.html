<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body id="contact">
  <main id="contactform">
    <header>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <div class="formfield">
    <h1>Contact Us</h1>
    <form id="contactForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" data-testid="test-contact-name" aria-describedby="error-name" required>
        <p id="error-name" data-testid="test-contact-error-name" class="error"></p>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" data-testid="test-contact-email" aria-describedby="error-email" required>
        <p id="error-email" data-testid="test-contact-error-email" class="error"></p>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" data-testid="test-contact-subject" aria-describedby="error-subject" required>
        <p id="error-subject" data-testid="test-contact-error-subject" class="error"></p>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="5" data-testid="test-contact-message" aria-describedby="error-message" required></textarea>
        <p id="error-message" data-testid="test-contact-error-message" class="error"></p>
      </div>

      <button type="submit" data-testid="test-contact-submit">Submit</button>
    </form>

    <p class="success" data-testid="test-contact-success" id="successMsg"></p>
    </div>
  </main>

  <script src="formvalidation.js"></script>
</body>
</html>
